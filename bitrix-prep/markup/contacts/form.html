<section class="contacts-form-section" id="contact-form" aria-labelledby="contact-form-title">
        <h2 id="contact-form-title">Давайте строить вместе</h2>
        <form class="contact-form" data-contact-form novalidate>
          <div class="contact-fields">
            <div class="contact-field" data-field>
              <label for="contact-name">Имя*</label>
              <input id="contact-name" name="name" type="text" placeholder="Ваше имя" autocomplete="name" required>
              <span class="contact-field__error">Обязательное поле</span>
            </div>
            <div class="contact-field" data-field>
              <label for="contact-organization">Организация</label>
              <input id="contact-organization" name="organization" type="text" placeholder="Название организации" autocomplete="organization">
              <span class="contact-field__error">Обязательное поле</span>
            </div>
            <div class="contact-field" data-field>
              <label for="contact-phone">Телефон*</label>
              <input id="contact-phone" name="phone" type="tel" placeholder="+7" autocomplete="tel" inputmode="tel" pattern="[+]7 [0-9]{10}" required>
              <span class="contact-field__error">Обязательное поле</span>
            </div>
            <div class="contact-field" data-field>
              <label for="contact-email">Почта*</label>
              <input id="contact-email" name="email" type="email" placeholder="Ваша почта" autocomplete="email" required>
              <span class="contact-field__error">Обязательное поле</span>
            </div>
            <div class="contact-field contact-field--message" data-field>
              <label for="contact-message">Сообщение</label>
              <textarea id="contact-message" name="message" placeholder="Опишите задачу" rows="1"></textarea>
              <span class="contact-field__error">Обязательное поле</span>
            </div>
          </div>

          <div class="contact-form__bottom">
            <label class="contact-consent" data-consent>
              <input class="contact-consent__input" type="checkbox" name="consent" required>
              <span class="contact-consent__box" aria-hidden="true"></span>
              <span class="contact-consent__text">Нажимая кнопку «Отправить», вы подтверждаете, что ознакомлены и согласны с <a href="documents.html#policy">Политикой в отношении обработки персональных данных</a> и даёте <a href="documents.html#agreement">Согласие на обработку персональных данных</a>. Вы также подтверждаете достоверность предоставленных данных.</span>
            </label>
            <button class="button contact-form__submit" type="submit"><span class="button__text button__text--current">Отправить</span><span class="button__text button__text--hover" aria-hidden="true">Отправить</span></button>
            <p class="contact-form__status" role="status" aria-live="polite" hidden>Спасибо, заявка отправлена.</p>
          </div>
        </form>
      </section>
